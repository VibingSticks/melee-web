# Per-struct field annotations for tools/gen_schema.py (see its docstring).
# Union cases are walked at the union slot: a pointer member is written "T*".

# --- sysdolphin descriptors -------------------------------------------------
HSD_Joint:
  u: { union_on: flags, mask: 0x4020, cases: { 0: "HSD_DObjDesc*", 0x4000: "HSD_Spline*", 0x20: "HSD_SList*" } }
  mtx: { ptr_array: f32, len_const: 12 }
HSD_Spline:
  # spline.c splGetSplinePoint reads segPoly[idx] as the five Hermite
  # coefficients of each segment: (numcv - 1) rows of floats, to the next
  # object. Left opaque, Mute City's track ran on big-endian coefficients.
  segPoly: { ptr_array: f32, object_run: true }
  cv: { ptr_array: Vec3, len_field: numcv }
  segLength: { ptr_array: f32, len_field: numcv }
HSD_PObjDesc:
  verts: { ptr_array: HSD_VtxDescList, term_value: 0xFF }   # GX_VA_NULL
  u: { union_on: flags, mask: 0x3000, cases: { 0: "HSD_Joint*", 0x1000: "HSD_ShapeSetDesc*", 0x2000: "port_EnvelopeList*" } }
HSD_ShapeSetDesc:
  vertex_desc: { ptr_array: HSD_VtxDescList, term_value: 0xFF }
  normal_desc: { ptr_array: HSD_VtxDescList, term_value: 0xFF }
HSD_RObjDesc:
  u: { union_on: flags, mask: 0x70000000, cases: { 0: "HSD_ExpDesc*", 0x10000000: "HSD_Joint*", 0x20000000: f32, 0x30000000: "HSD_ByteCodeExpDesc*", 0x40000000: "HSD_IKHintDesc*" } }
HSD_LightDesc:
  u: { union_on: flags, mask: 0x43, cases: { 0x40: "HSD_LightAttn*", 0x41: "HSD_LightAttn*", 0x42: "HSD_LightAttn*", 0x43: "HSD_LightAttn*", 0x02: "HSD_LightPointDesc*", 0x03: "HSD_LightSpotDesc*", 0x00: "port_F32*", 0x01: "port_F32*" } }
HSD_CObjDesc:
  __union__: { disc_offset: 6, disc_size: 2, cases: { 1: HSD_CameraDescPerspective, 2: HSD_CameraDescFrustum, 3: HSD_CameraDescFrustum } }
HSD_CameraDescCommon:
  up_vector: { ptr_array: Vec3, len_const: 1 }
HSD_CameraDescFrustum:
  up_vector: { ptr_array: Vec3, len_const: 1 }
HSD_CameraDescPerspective:
  up_vector: { ptr_array: Vec3, len_const: 1 }
HSD_AObjDesc:
  # An object id, or a relocated pointer to the joint HSD_AObjLoadDesc loads
  # (HSD_JObjLoadJoint) when no object has that id. Fountain of Dreams' light
  # animations point at one; left big-endian, loading the stage crashed in
  # MObjLoad.
  obj_id: { word: { ptr: HSD_Joint } }
HSD_TexAnim:
  imagetbl: { ptr_array: "HSD_ImageDesc*", len_field: n_imagetbl }
  tluttbl: { ptr_array: "HSD_TlutDesc*", len_field: n_tluttbl }

# --- melee scene descriptors --------------------------------------------------
DynamicModelDesc:
  anims: { ptr_array: "HSD_AnimJoint*", null_term: true }
  matanims: { ptr_array: "HSD_MatAnimJoint*", null_term: true }
  shapeanims: { ptr_array: "HSD_ShapeAnimJoint*", null_term: true }
SceneDesc:
  models: { ptr_array: "DynamicModelDesc*", null_term: true }
  lights: { ptr_array: "LightList*", null_term: true }
SceneCameraDesc:
  anims: { ptr_array: "HSD_CameraAnim*", null_term: true }
LightList:
  anims: { ptr_array: "HSD_LightAnim*", null_term: true }
SceneFogDesc:
  anims: { ptr_array: "HSD_CameraAnim*", null_term: true }

# --- mirrors ---------------------------------------------------------------------
port_lbAudioLoadData:
  x0: { ptr_array: port_IntListPtr, len_const: 30 }
  x4: { ptr_array: port_IntListPtr, len_const: 30 }
  x8: { ptr_array: port_IntListPtr, len_const: 30 }
  xC: { ptr_array: port_IntListPtr, len_const: 30 }
port_IntListPtr:
  list: { ptr_array: u32, term_value: 0x83D60 }
port_EnvelopeDescList:
  e: { null_term: true }
port_EnvelopeList:
  p: { null_term: true }

# --- menus and events -----------------------------------------------------------

# --- stages ------------------------------------------------------------------
GroundParam:
  # A table of stkind rows, not one row: without the length only row 0 was
  # converted, so grGetStageParam walked big-endian ids (stkind 96 read back as
  # 0x60000000) and gave up with "not found stage param" at ground.c:2310.
  stage_params: { ptr_array: StageParam, len_field: stage_param_count }
UnkStageDat:
  unk0:  { ptr_array: port_StageJointMap, len_field: unk4 }
  unk8:  { ptr_array: UnkStageDat_x8_t, len_field: unkC }
  unk10: { ptr_array: "HSD_Spline*", len_field: unk14 }
  # unk1C is 2x the row count on disc (see mirrors.h); run to the next object
  unk18: { ptr_array: port_LightOverrideEntry, object_run: true }
  unk20: { ptr_array: GroundShadowEntry, len_field: unk24 }
  unk28: { ptr_array: "UnkStageDatInternal*", len_field: unk2C }
UnkStageDat_x8_t:
  unk4:  { ptr_array: "HSD_AnimJoint*", null_term: true }
  unk8:  { ptr_array: "HSD_MatAnimJoint*", null_term: true }
  unkC:  { ptr_array: "HSD_ShapeAnimJoint*", null_term: true }
  x18:   { ptr_array: "LightList*", null_term: true }
  unk20: { ptr_array: GrJoint, len_field: unk24 }
  x2C:   { ptr_array: u16, len_const: 1 }
MapCollData:
  verts:  { ptr_array: Vec2, len_field: vert_count }
  lines:  { ptr_array: MapLine, len_field: line_count }
  joints: { ptr_array: MapJoint, len_field: joint_count }
  # The archive object is 0x2C bytes: in 54 of the 57 stage files the next
  # object starts at +0x2C (in GrGb/GrSt/GrZe that is map_ptcl, whose version
  # word this field would swap). Nothing reads x2C; leave the bytes alone.
  x2C: { opaque: true }
port_GroundItemData:
  # ground.c registers each entry's one Article under its item kind
  # (it_8026B40C(article, kind)); the state rows carry the item scripts,
  # converted after the walk. The Article is typed by the entry's item kind
  # (It_Kind_*): the kinds any GrXx.dat
  # itemdata holds. Most attribute blocks start with a header pointer
  # (port_StageItemAttrs); Flat Zone's tools and the Great Fox laser are
  # plain words; Tingle (221) has his own struct.
  article:
    union_on: kind
    cases: {
      209: { variant: Article, fields: { x4_specialAttributes: port_StageItemAttrs } },
      210: { variant: Article, fields: { x4_specialAttributes: port_StageItemAttrs } },
      211: { variant: Article, fields: { x4_specialAttributes: port_StageItemAttrs } },
      212: { variant: Article, fields: { x4_specialAttributes: port_StageItemAttrs } },
      213: { variant: Article, fields: { x4_specialAttributes: port_StageItemAttrs } },
      217: { variant: Article, fields: { x4_specialAttributes: port_StageItemAttrs } },
      218: { variant: Article, fields: { x4_specialAttributes: port_StageItemAttrs } },
      219: { variant: Article, fields: { x4_specialAttributes: port_StageItemAttrs } },
      220: { variant: Article, fields: { x4_specialAttributes: port_StageItemAttrs } },
      221: "port_GbArticle*",
      225: { variant: Article, fields: { x4_specialAttributes: port_StageItemAttrs } },
      226: { variant: Article, fields: { x4_specialAttributes: port_StageItemAttrs } },
      230: { variant: Article, fields: { x4_specialAttributes: port_F32Run } },
      233: { variant: Article, fields: { x4_specialAttributes: port_StageItemAttrs } },
      234: { variant: Article, fields: { x4_specialAttributes: port_StageItemAttrs } },
      235: { variant: Article, fields: { x4_specialAttributes: port_F32Run } },
      236: { variant: Article, fields: { x4_specialAttributes: port_StageItemAttrs } }
    }
# Great Bay's entry (see mirrors.h): as Article, with Tingle's attributes typed.
port_GbArticle:
  xC_itemStates: { ptr_array: ItemStateDesc, object_run: true }
  x14_dynamics:  { ptr: port_ItemDynamics }

# --- player, item and effect tables ------------------------------------------
port_PlLoadCommonDataRef:
  data: { ptr: pl_804D6470_t }
port_StageJointMap:
  pairs: { ptr_array: port_StageJointPair, len_field: pair_count }
port_FtLoadCommonData:
  # tables indexed by fighter kind (Ft_Kind_Max)
  # ...except float5_rows, which is not. fighter.h declares it
  # `float (*Fighter_804D654C)[5]` and ftswing.c indexes it
  # [swing_type][arg1], the same pair as lbl_803C6D70[6][5] beside it -- so it
  # has six rows, not thirty-three. Walking it as 33 ran 540 bytes past the end
  # into neighbouring data holding real pointers, which the walker reported as
  # "scalar descriptor on a pointer slot" and which ended in a wasm trap once
  # the game used what had been scribbled on.
  float5_rows:     { ptr_array: port_Float5, len_const: 6 }
  # ftCo_ItemThrow.c indexes this by motion id - ftCo_MS_LightThrowF: 26 rows,
  # ending where the next table starts. Never converted before, so every item
  # throw read its speed as ~2.7e23 (big-endian 2.6); the thrown item crossed
  # the stage in one frame and a fighter in its path took infinite damage.
  item_throws:     { ptr_array: port_ItemThrowRow, len_const: 26 }
  # Also never converted: the hit-shake offsets played during hitlag
  # (ftCo_80090690; counts read as 0, offsets as denormals or huge numbers).
  hit_shake:       { ptr_array: port_HitShakeRow, len_const: 3 }
  per_kind_floats: { ptr_array: f32, len_const: 33 }
  parts_tables:    { ptr_array: "FighterPartsTable*", len_const: 33 }
  virtual_parts:   { ptr_array: "Fighter_804D6540_t*", len_const: 33 }
  # Colour-animation script tables (ftcolanim.c ftCo_800BFFD0): rows of
  # {script, u8, u8} running to the next object; the scripts they point at are
  # converted by port_archive_convert_scripts (port_swap_co_cmd_scripts).
  colanim_a:       { ptr_array: Fighter_804D653C_t, object_run: true }
  colanim_b:       { ptr_array: Fighter_804D653C_t, object_run: true }
Fighter_804D6540_t:
  x0: { ptr_array: Fighter_804D6540_x0_t, len_field: x4 }
Fighter_ShakeTable_t:
  x0: { ptr_array: Vec2, len_field: x4 }
ftData:
  # ft_8007C630 reads ARRAY_SIZE(Fighter::x1614) = 2 rows; every character's
  # archive holds two. With one row converted, Yoshi's and Popo's second row
  # kept a big-endian part index and indexed fp->parts out of bounds.
  x38: { ptr_array: ftData_x38, len_const: 2 }
  # These animation tables are converted where the game reads them
  # (ftData_80085A14): their length is a table in the code, not in the archive.
  xC:  { ptr: opaque }
  x14: { ptr: opaque }
  # Wait-animation weight tables, read until an entry whose first word is -1
  # (ftwaitanim.c getAnimID). x24 is UNK_T in the headers but the two callers
  # in ft_0D4D.c pass it straight to ftCo_8008A7A8(WaitStruct*).
  x24: { ptr_array: port_WaitEntry, term_value: 0xFFFFFFFF }
  x28: { ptr_array: port_WaitEntry, term_value: 0xFFFFFFFF }
  # Declared int, but the relocation table says pointer: bone indices for gfx
  # part 0x8D, read as ((int*) fp->ft_data->x54)[n] in ftCo_09F7.c:75 with the
  # counter wrapping at 5.
  x54: { ptr_array: u32, len_const: 5 }
  # Five part-animation slots (ftanim.c indexes them by ARRAY_SIZE(Fighter::x8B0)
  # and the scripts' part_anim.unk1). Each row's x0 is the first part and x8 the
  # AnimJoint per animation. Undescribed, x0 stayed big-endian, ftAnim_80070904
  # started its part walk at 0x100 and read off the end of fp->parts: the
  # HSD_JObjAddAnim trap a few seconds into the first Classic match.
  # The slot count varies by character (thirteen have fewer than five), so the
  # list runs while its words are pointers and stops at the next object.
  x1C: { ptr_array: "ftData_x1C*", object_run: true }
ftData_x1C:
  # x4 is x2 part indices (bytes); x8 runs to the next object.
  x8: { ptr_array: "HSD_AnimJoint*", object_run: true }
FtSFX:
  # Declared int, but it sits between two FtSFXArr* and the relocation table
  # says pointer. ftCo_Damage.c:503 stores it in dmg.x190C exactly as x20 is
  # stored at :496, and ftCo_DamageFall.c:90 hands x190C to ft_800889F4,
  # which reads it as FtSFXArr* (num / sfx_ids).
  x1C: { word: { ptr: FtSFXArr } }
FtSFXArr:
  # Was {F_PTR, NULL}: followed but never converted, so the sound-id arrays of
  # smash, x1C and x20 all stayed big-endian.
  sfx_ids: { ptr_array: u32, len_field: num }
Fighter_804D64FC_t:
  # The CPU's attack tables (ftcpuattack.c): per fighter kind, a list of
  # candidates each of the six selectors filters by cpu level, range and
  # weight. Left big-endian, no candidate ever passed and computer players
  # only ever walked and jumped, whatever their level. 32 entries each in
  # PlCo.dat (the tables sit back to back, 0x80 bytes apart); a 33rd ran
  # into the next table, and x1C's into x20's floats.
  x4:  { ptr_array: port_CpuAttackList, len_const: 32 }
  x8:  { ptr_array: port_CpuAttackList, len_const: 32 }
  xC:  { ptr_array: port_CpuAttackList, len_const: 32 }
  x10: { ptr_array: port_CpuAttackList, len_const: 32 }
  x14: { ptr_array: port_CpuAttackList, len_const: 32 }
  x18: { ptr_array: port_CpuAttackList, len_const: 32 }
  x1C: { ptr_array: port_CpuAttackList, len_const: 32 }
  x20: { ptr_array: f32, len_const: 32 }   # per-fighter distance thresholds
  x24: { ptr_array: f32, len_const: 6 }    # weapon reach by item kind (ftcpuattack.c:1849)
port_CpuAttackList:
  list: { ptr_array: port_ftCo_AttackEntry, term_value: 0 }
ftData_x30:
  inits: { ptr_array: ftHurtboxInit, len_field: count }
port_EfDataTable:
  descs: { reloc_run: true }

# --- ItCo.dat: item common data ------------------------------------------------
# The root is the six-pointer struct iteffect.c copies into the it_804D6D* globals.
# The three Article tables are indexed by item kind (item.c Item_80267978): 43
# common items, 118 character items (only Kuriboh..Ottosea, Unk4 and Coin live in
# ItCo.dat; the fighters' own PlXx.dat articles are registered at load), and 47
# Poke Ball Pokemon. Each Article::x4_specialAttributes is a different struct per
# kind, given here where a kind's code names it and the struct's size matches the
# block in the archive (port/tools: the block runs to the next object). A ~ leaves
# that block big-endian: the code reads it through a run-time struct, the sizes
# disagree, or nothing reads it.
# itheart.c reads x4 only as the u32 (the heal amount, 999); the header also
# spells it as eight flag bits nobody reads, and the union rule would otherwise
# leave the word big-endian.
HeartContainerAttr:
  x4: { word: true }

it_804D6D20_t:
  # x8: monsters and Poke Ball entries, indexed by kind - It_Kind_Kuriboh up to
  # It_PKind_Random (118 slots, mostly NULL); xC: the 47 Pokemon. Their special
  # attribute blocks are not typed yet, so the Article's x4 is left alone.
  x8: { ptr_array: "Article*", len_const: 118 }
  xC: { ptr_array: "Article*", len_const: 47 }
  x4:
    ptr_list: Article
    len_const: 43
    elem_field: x4_specialAttributes
    elem_types: [
      ItCapsuleAttr, itBoxAttributes, itTaruAttributes, ~, itKusudamaAttributes,
      itTaruCann_DatAttrs, ~, itDoseiAttributes, HeartContainerAttr, MaximTomatoSpecialAttr,
      itStar_ItemVars, itBatAttributes, itSword_UnkArticle1, port_F32Run, port_itGShell_Attrs,
      port_itRShell_Attrs, ItLGunAttr, itUnkAttributes, { x4_specialAttributes: port_itFoodsAttrs, x10_modelDesc: port_ItemModelDescJoints }, port_itMsBomb_Attrs,
      itFlipper_DatAttrs, itSScopeAttributes, port_StarRodAttributes, itLipstickAttributes,
      itHarisen_DatAttrs, FFlowerAttr, port_KinokoAttrs, port_KinokoAttrs, port_itHammerData,
      { x4_specialAttributes: itWstarAttributes, x10_modelDesc: port_ItemModelDescAnims }, ~, ~, ~, ~, itPokemonSpawn_DatAttrs, ItLGunRayAttr, port_StarRodStarAttrs,
      itLipstickSporeAttributes, ScopeBeamAttrs, ItLGunBeamAttr, itHammerheadAttributes,
      port_F32Run, itEvYoshiEgg_DatAttrs ]
  x8:
    ptr_list: Article
    len_const: 118
    elem_field: x4_specialAttributes
    # 5..114 are the fighters' own items: their Articles live in the PlXx.dat
    # archives and are converted as it_8026B3F8 registers them
    # (port_swap_ft_article), typed by this list. A kind whose code reads the
    # block as bare words, or through a struct the schema cannot see, takes a
    # float run to the next object. Game & Watch's ten items (71..79, 81) and
    # Kirby's copies of the chef and pan (112, 113) start with the pointer to
    # their outline bone lists (port_GwItemDraw).
    elem_types: [
      ~, itLeadeadAttributes, itOctarockAttributes, itOldottoseaAttributes, ~, itUnkAttributes, itDrMarioPillAttributes,
      itKirbyCutterBeamAttributes, port_F32Run, itUnkAttributes, port_F32Run, FoxLaserAttr, FoxLaserAttr,
      port_F32Run, port_F32Run, port_F32Run, port_F32Run, itLinkBoomerangAttributes, itLinkBoomerangAttributes,
      itLinkHookshotAttributes, itLinkHookshotAttributes, itLinkArrowAttributes, itLinkArrowAttributes,
      itNessPKFirepillarAttributes, itNessPKFirepillarAttributes, itFlashAttributes, itPKThunderAttributes,
      port_F32Run, port_F32Run, port_F32Run, port_F32Run, port_F32Run, port_F32Run, port_F32Run, port_F32Run,
      itFlashExplAttributes, itSeakNeedleThrownAttributes, port_F32Run, itPikachuthunderAttributes,
      itPikachuthunderAttributes, port_F32Run, port_F32Run, port_F32Run, itYoshiEggThrowAttributes,
      port_F32Run, port_F32Run, itPikachutJoltGroundAttributes, port_F32Run, itPikachutJoltGroundAttributes,
      port_F32Run, itSamusBombAttributes, itSamusChargeShot_Attributes, itSamusMissileAttributes, itSamusGrappleAttributes,
      itSeakChain_Attrs, port_F32Run, port_F32Run, port_F32Run, port_F32Run, itYoyoAttributes, port_F32Run,
      port_F32Run, itUnkAttributes, itClimbersIceAttributes, itClimbersBlizzardAttributes, port_F32Run,
      port_F32Run, itMDisableAttributes, port_F32Run, itMewtwoShadowball_DatAttrs, itClimbersStringAttributes,
      port_GwItemAttrs, port_GwItemAttrs, port_GwItemAttrs, port_GwItemAttrs, port_GwItemAttrs, port_GwItemAttrs, port_GwItemAttrs, port_GwItemAttrs,
      itGamewatchchefAttributes, port_F32Run, port_GwItemAttrs, itMasterHandLaserAttributes, itMasterHandBulletAttributes,
      itMasterHandLaserAttributes, itMasterHandBulletAttributes, itCrazyHandBombAttributes, itUnkAttributes,
      itDrMarioPillAttributes, itUnkAttributes, itClimbersIceAttributes, port_F32Run, port_F32Run,
      FoxLaserAttr, FoxLaserAttr, port_F32Run, port_F32Run, itLinkArrowAttributes, itLinkArrowAttributes,
      port_F32Run, port_F32Run, itMewtwoShadowball_DatAttrs, itFlashAttributes, itFlashExplAttributes,
      itPikachutJoltGroundAttributes, port_F32Run, itPikachutJoltGroundAttributes, port_F32Run, itSamusChargeShot_Attributes,
      itSeakNeedleThrownAttributes, port_F32Run, port_F32Run, itGamewatchchefAttributes, port_GwItemAttrs,
      port_F32Run, it_2E5A_Attrs, itCoinAttributes, ~ ]
  xC:
    ptr_list: Article
    len_const: 47
    elem_field: x4_specialAttributes
    elem_types: [
      itTosakinto_Attrs, itChicoritaLeafAttr, itKabigonAttributes, itKamexAttributes,
      itMatadogasAttributes, itLizardonAttributes, itFireAttributes, itThunderPokemonAttributes,
      itFreezerAttributes, itsonansAttributes, ~, { x4_specialAttributes: itUnknownAttributes, x10_modelDesc: port_ItemModelDescJoints }, ~, ~, ~,
      itkireihanaAttributes, ~, itLugiaAttributes, itHououAttr, ~, itPokemonAttributes,
      itPokemonAttributes, MewVars, port_F32Run, itHitodemanAttributes, itLuckyAttributes, ~, ~,
      itMarilAttributes, itFushigibanaAttributes, ~, ~, ~, ~, ~, ~, ~, ~, itUnknownAttributes,
      port_F32Run, port_F32Run, port_F32Run, ~, ~, ~, ~, ~ ]
  # colour-animation table (lb_013B.c): {script, priority, enable} rows indexed
  # by colanim id; the scripts are a third bytecode, left big-endian for now.
  x14: { ptr_array: Fighter_804D653C_t, object_run: true }
Article:
  # ItemStateDesc rows indexed by animation id; nothing records the count and
  # the archive packs the Article itself right after the rows.
  xC_itemStates: { ptr_array: ItemStateDesc, object_run: true }
  x14_dynamics:  { ptr: port_ItemDynamics }
ItemStateDesc:
  # Some rows' x4 and x8 are extern reference slots rather than pointers (the
  # Arwing lasers' in GrVe/GrCn, the Fire Flower's "0x3908, then -1"): the
  # walk leaves those to HSD_ArchiveLocateExtern. As words, the rows still
  # form a run (as pointers the run stopped at row 0, and the lasers' scripts
  # stayed big-endian).
  x4_matanim_joint: { word: { ptr: HSD_MatAnimJoint } }
  x8_parameters: { word: { ptr: HSD_ShapeAnimJoint } }
ItHurtBoneList:
  descs: { ptr_array: ItHurtBoneDesc, len_field: count }
port_ItemDynamics:
  dyn_descs:  { ptr_array: BoneDynamicsDesc, len_field: count }
  coll_descs: { ptr_array: port_ItCollDynamicsDesc, len_field: coll_count }
# lb_80011710 reads DynamicsDesc::data as `count` lb_00F9_UnkDesc1Inner rows
# (the run-time DynamicsData is a different, allocated struct).
DynamicsDesc:
  data: { ptr_array: lb_00F9_UnkDesc1Inner, len_field: count }
# gricemt.c reads field_ixs[0..4] (icemt_field indices); the archive holds no
# count.
port_grIceMt_YakumonoParam:
  field_ixs: { ptr_array: u16, len_const: 5 }
FigaTree:
  # One FigaTrack per animated channel of every joint (the node list's counts
  # add up to the length), not the single track the pointer type names. With
  # only the first converted, every other track kept byte-swapped length and
  # start-frame fields; a track played past its end read on into the next
  # track's bytes (Mewtwo's hit animation translated his tail root to 1e25
  # and the collision stepper froze the tab). Each row holds a data pointer,
  # so the run ends at the first word that is not one.
  tracks: { ptr_array: FigaTrack, object_run: true }
# ftdynamics.c reads dynamicsNum rows of ftDynamicBones; the header's
# ArticleDynamicBones declares the maximum (10), and the rows past the count
# are whatever the archive packed next.
ftDynamics:
  # Physics-bone animations: undescribed, Mewtwo's tail animation stayed
  # big-endian, its root bone was translated to 1e25 when he was hit, and the
  # collision stepper took billions of steps (the tab froze).
  x10: { ptr_array: port_DynFigaSlot, object_run: true }
  # the physics colliders: x4 of them (ftColl copies dyn->x8[i] for i < x4;
  # Peach's dress has several), not the single entry the pointer type says
  x8: { ptr_array: ftData_x38, len_field: x4 }
port_DynFigaSlot:
  trees: { ptr_array: port_FigaTreeRef, object_run: true }
ftDynamics__anon0:
  ftDynamicBones: { ptr_array: BoneDynamicsDesc, len_field: dynamicsNum }
itWstarAttributes:
  x28_entries: { object_run: true }   # x24_count rows, declared [1]
port_itFoodsAttrs:
  rows: { object_run: true }
itSamusGrappleAttributes:
  # Four animation sets, one per grapple part; itsamusgrapple.c reads the
  # first entry of each (*attrs->x74 ...). Unfollowed, the grab trapped in
  # HSD_TObjAddAnimAll on big-endian material animations.
  x74: { ptr_array: "HSD_AnimJoint*", len_const: 1 }
  x78: { ptr_array: "HSD_MatAnimJoint*", len_const: 1 }
  x7C: { ptr_array: "HSD_ShapeAnimJoint*", len_const: 1 }
