# Public symbol -> root type; prefix/suffix match, longest total match wins.
# `array: null_term` means the symbol is itself a NULL-terminated list of `type`.
- { prefix: lbAudioLoadData, type: port_lbAudioLoadData }
- { suffix: _joint, type: HSD_Joint }
- { suffix: _animjoint, type: HSD_AnimJoint }
- { suffix: _matanim_joint, type: HSD_MatAnimJoint }
- { suffix: _shapeanim_joint, type: HSD_ShapeAnimJoint }
- { suffix: _camera, type: HSD_CObjDesc }
- { suffix: _fog, type: HSD_FogDesc }
- { suffix: _sobjdesc, type: HSD_SObjDesc }
- { suffix: _scene_data, type: SceneDesc }
- { suffix: _scene_lights, type: "LightList*", array: null_term }
- { suffix: _scene_models, type: "DynamicModelDesc*", array: null_term }
# Pointer-only or byte-only data: the relocation pass already made it usable.
- { prefix: lbRumbleData, type: opaque }     # LbBf.dat: {void* seq; u8; u8}[]
- { prefix: MemCardBanner_, type: opaque }   # LbMcGame: raw banner texels
- { prefix: MemCardIcon, type: opaque }      # LbMcGame: icon pointer table and texels
- { prefix: SIS_, type: opaque }             # sislib text tables: kerning bytes and glyph texels
- { suffix: _camanim, type: HSD_CameraAnim }
- { suffix: _lightanim, type: HSD_LightAnim }
# Stage archives export their textures and palettes as plain HSD descriptors.
- { suffix: _image, type: HSD_ImageDesc }
- { suffix: _tlut_desc, type: HSD_TlutDesc }
- { suffix: _tlut, type: HSD_Tlut }
- { prefix: MnSelectChrDataTable, type: port_MnSelectChrDataTable }
- { prefix: sqEventInitDataLevelTbl, type: port_EventInitLevel }
- { prefix: MemSnap, type: opaque }        # LbMcSnap: banner/icon texels and pointer tables
- { prefix: mnName, type: opaque }         # name lists: arrays of relocated string pointers
# Stage archives (grdatfiles.c).
- { prefix: map_head, type: UnkStageDat }
- { prefix: coll_data, type: MapCollData }
- { prefix: grGroundParam, type: GroundParam }
- { prefix: quake_model_set, type: DynamicModelDesc }
- { prefix: map_plit, type: "LightList*", array: null_term }
- { prefix: itemdata, type: "port_GroundItemData*", array: null_term }
- { prefix: map_ptcl, type: opaque }        # particle banks: converted in particle.c
- { prefix: map_texg, type: opaque }
- { prefix: ALDYakuAll, type: opaque }      # pointer table; element type not known yet
- { prefix: yakumono_param, type: opaque }
- { prefix: plLoadCommonData, type: port_PlLoadCommonDataRef }
- { prefix: eff, suffix: DataTable, type: port_EfDataTable }
- { prefix: itPublicData, type: it_804D6D20_t }   # ItCo.dat: see annotations.yml
- { prefix: lbRefData, type: opaque }      # LbRf.dat refraction parameters: float array length not known yet
- { prefix: ftData, type: ftData }
- { prefix: ftLoadCommonData, type: port_FtLoadCommonData }
