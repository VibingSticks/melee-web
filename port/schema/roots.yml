# Texture exports: `_tlut_desc` is an HSD_TlutDesc, but `_image` and `_tlut`
# name the raw texels and palette entries themselves (all 2903 and 644 of them
# on the disc; none starts with a relocated pointer). Those stay big-endian for
# the GX layer, so they must not be walked as descriptors -- doing so swapped
# the first 24 texel bytes and 16 palette bytes of every stage texture.
- { suffix: _image, type: opaque }
- { suffix: _tlut_desc, type: HSD_TlutDesc }
- { suffix: _tlut, type: opaque }
- { prefix: MnSelectChrDataTable, type: port_MnSelectChrDataTable }
- { prefix: MnSelectStageDataTable, type: port_MnSelectStageDataTable }
- { prefix: sqEventInitDataLevelTbl, type: port_EventTable }
# gmtou_0.c / gmtou_1.c: TmBox.dat bracket box tables (see port_BracketSrcEntry).
- { prefix: tournament_box, type: port_BracketSrcEntry, array: object_run }
# toy.c: the trophy tables (TyDatai.usd, TyDataf.dat) are pointer-free rows
# with no stored count; each runs to the next root. Left big-endian, the
# lottery drew trophy 0 ("Dummy") and never awarded anything.
# Scene descriptions with no suffix rule: the results screen (GmRst: pnlsce,
# flmsce -- its camera's projection was still big-endian and CObjLoad
# asserted), the Classic ending and trophy stand (GmRegEnd, GmRgStnd) and the
# Adventure cutscenes (Vi*). All are SceneDesc in the code that loads them.
- { prefix: pnlsce, type: SceneDesc }
- { prefix: flmsce, type: SceneDesc }
- { suffix: Scene, type: SceneDesc }
