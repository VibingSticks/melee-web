- { prefix: ftDataCaptain, type: ftData, field_types: { ext_attr: ftCaptain_DatAttrs } }
- { prefix: ftDataCrazyhand, type: ftData, field_types: { ext_attr: ftCrazyHand_DatAttrs } }
- { prefix: ftDataFox, type: ftData, field_types: { ext_attr: ftFox_DatAttrs } }
- { prefix: ftDataKirby, type: ftData, field_types: { ext_attr: ftKb_DatAttrs } }
- { prefix: ftDataLink, type: ftData, field_types: { ext_attr: ftLk_DatAttrs } }
- { prefix: ftDataMario, type: ftData, field_types: { ext_attr: ftMario_DatAttrs } }
