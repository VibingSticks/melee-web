<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Aurora web spike</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 13px monospace; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #status { position: fixed; left: 8px; top: 8px; white-space: pre; pointer-events: none; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1"></canvas>
<div id="status">starting…</div>
<script>
  // Spike diagnostics: keep a JS reference to the device and report loss / uncaptured errors.
  window.__devices = [];
  if (window.GPUAdapter) {
    const _rd = GPUAdapter.prototype.requestDevice;
    GPUAdapter.prototype.requestDevice = async function (...a) {
      const d = await _rd.apply(this, a);
      window.__devices.push(d);
      d.lost.then(i => console.log('[hook] device.lost reason=' + i.reason + ' message=' + i.message));
      d.addEventListener('uncapturederror', ev => console.log('[hook] uncapturederror: ' + ev.error.constructor.name + ': ' + ev.error.message));
      return d;
    };
  }
  var Module = {
    canvas: document.getElementById('canvas'),
    setStatus: function (t) { document.getElementById('status').textContent = t; },
    print: function (t) { console.log(t); },
    printErr: function (t) { console.error(t); },
  };
</script>
<!-- Emscripten requires the placeholder; it is neutralised here and simple.js is loaded below instead.
{{{ SCRIPT }}}
-->
<script type="module">
  // ?renderer=webgl2 installs the WebGL2 polyfill (port/web/js/gpu-gl2.js) before the wasm starts.
  const renderer = new URLSearchParams(location.search).get('renderer');
  if (renderer === 'webgl2') {
    const { loadNaga } = await import('../../../web/js/naga/naga.js');
    const { installWebGL2Fallback } = await import('../../../web/js/gpu-gl2.js');
    const naga = await loadNaga('../../../web/js/naga/naga.wasm');
    installWebGL2Fallback({ canvas: Module.canvas, naga, force: true });
    console.log('[shell] WebGL2 fallback installed');
  }
  const s = document.createElement('script');
  s.src = 'simple.js';
  document.body.appendChild(s);
</script>
</body>
</html>
