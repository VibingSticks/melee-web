<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Filled in at build time (CMake) and again when the offline file is packed,
     so a crash report says which commit it came from. -->
<meta name="melee-build" content="@PORT_BUILD_ID@">
<title>Melee</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0b0e; color: #ddd; font: 14px system-ui, sans-serif; }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  #bar { display: flex; gap: 12px; align-items: center; padding: 8px 12px; background: #16161c; }
  #bar label { cursor: pointer; }
  #status { flex: 1; opacity: .85; }
  #status.error { color: #ff7b7b; }
  #renderer-box { font-size: 12px; opacity: .8; display: flex; gap: 6px; align-items: center; }
  #renderer-box select { font: inherit; color: #ddd; background: #24242c; border: 1px solid #3a3a46; border-radius: 4px; }
  #renderer-box select[disabled] { opacity: .5; }
  #renderer { opacity: .75; }
  /* The game renders 4:3. Let the canvas take the space it is given but keep
     its own shape inside it, so a wider window letterboxes instead of
     stretching everything sideways. */
  #stage { flex: 1; min-height: 0; position: relative; display: flex; }
  #canvas { flex: 1; width: 100%; min-height: 0; background: #000; outline: none;
            object-fit: contain; }
  /* The boot screen while the shader pipelines compile (preload_pipelines in
     main_loop.c). Tab does not hide it: it is the game's screen for now. */
  #preload { position: absolute; inset: 0; display: grid; place-items: center; background: #000; }
  #preload[hidden] { display: none; }
  #preload .box { width: min(420px, 86%); font: 13px monospace; color: #bbb; }
  #preload progress { width: 100%; height: 14px; margin: 8px 0; }
  #preload button { margin-top: 10px; font: inherit; }
  #saves, #crash { display: flex; gap: 8px; align-items: center; }
  #saves[hidden], #crash[hidden] { display: none; } /* the rule above would otherwise override hidden */
  #bar button, #bar .btn { font: inherit; color: #ddd; background: #24242c; border: 1px solid #3a3a46;
                           border-radius: 4px; padding: 3px 9px; cursor: pointer; }
  #bar button[disabled] { opacity: .45; cursor: default; }
  #bar button:not([disabled]):hover, #bar .btn:hover { background: #2f2f3a; }
  #crash button { border-color: #a04040; background: #3a1c1c; }
  #crash button:hover { background: #4a2424; }
  body.ui-hidden #bar, body.ui-hidden #log { display: none; }
  #log { height: 120px; margin: 0; padding: 6px 12px; overflow: auto; background: #101014; color: #9a9; font: 12px monospace; white-space: pre; }
</style>
</head>
<body>
<div id="wrap">
  <div id="bar">
    <label>Disc image (GALE01 .iso/.gcm): <input id="disc" type="file" accept=".iso,.gcm,.bin"></label>
    <span id="status">Pick your Melee disc image to start.</span>
    <label id="renderer-box" title="Which graphics API draws the game. Set it before picking the disc; changing it reloads the page.">
      Renderer
      <select id="renderer-select">
        <option value="auto">Auto</option>
        <option value="webgpu">WebGPU</option>
        <option value="webgl2">WebGL2</option>
      </select>
      <span id="renderer"></span>
    </label>
    <span id="saves" hidden>
      <button id="export" type="button" disabled title="Download your memory-card save">Export save</button>
      <label class="btn">Import save<input id="import" type="file" accept=".gci,.raw,.bin,.json" hidden></label>
      <button id="log-save" type="button" title="Save the game's log (frame timings, loads) as a text file for bug reports">Save log</button>
    </span>
    <span id="crash" hidden>
      <button id="crash-copy" type="button" title="Copy the crash report to the clipboard">Copy crash report</button>
      <button id="crash-save" type="button" title="Save the crash report as a text file">Save report</button>
    </span>
  </div>
  <div id="stage">
    <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
    <div id="preload" hidden>
      <div class="box">
        <div>Compiling shaders...</div>
        <progress id="preload-bar" max="1" value="0"></progress>
        <div id="preload-count">0 / 0</div>
        <div id="preload-eta">&nbsp;</div>
        <button id="preload-skip" type="button" title="The rest compile in the background">Skip</button>
      </div>
    </div>
  </div>
  <pre id="log"></pre>
</div>
<script type="module" src="boot.js"></script>
</body>
</html>
