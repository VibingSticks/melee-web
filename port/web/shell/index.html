<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Melee</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0b0e; color: #ddd; font: 14px system-ui, sans-serif; }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  #bar { display: flex; gap: 12px; align-items: center; padding: 8px 12px; background: #16161c; }
  #bar label { cursor: pointer; }
  #status { flex: 1; opacity: .85; }
  #status.error { color: #ff7b7b; }
  #renderer { opacity: .6; font-size: 12px; }
  /* The game renders 4:3. Let the canvas take the space it is given but keep
     its own shape inside it, so a wider window letterboxes instead of
     stretching everything sideways. */
  #canvas { flex: 1; width: 100%; min-height: 0; background: #000; outline: none;
            object-fit: contain; }
  #saves { display: flex; gap: 8px; align-items: center; }
  #saves button, #saves .btn { font: inherit; color: #ddd; background: #24242c; border: 1px solid #3a3a46;
                               border-radius: 4px; padding: 3px 9px; cursor: pointer; }
  #saves button[disabled] { opacity: .45; cursor: default; }
  #saves button:not([disabled]):hover, #saves .btn:hover { background: #2f2f3a; }
  #log { height: 120px; margin: 0; padding: 6px 12px; overflow: auto; background: #101014; color: #9a9; font: 12px monospace; white-space: pre; }
</style>
</head>
<body>
<div id="wrap">
  <div id="bar">
    <label>Disc image (GALE01 .iso/.gcm): <input id="disc" type="file" accept=".iso,.gcm,.bin"></label>
    <span id="status">Pick your Melee disc image to start.</span>
    <span id="renderer" title="Add ?renderer=webgl2 or ?renderer=webgpu to the URL to force one"></span>
    <span id="saves" hidden>
      <button id="export" type="button" disabled title="Download your memory-card save">Export save</button>
      <label class="btn">Import save<input id="import" type="file" accept=".gci,.raw,.bin,.json" hidden></label>
    </span>
  </div>
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <pre id="log"></pre>
</div>
<script type="module" src="boot.js"></script>
</body>
</html>
